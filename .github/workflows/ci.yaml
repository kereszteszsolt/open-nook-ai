name: OpenNook checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: open_nook_test_ci
          POSTGRES_USER: open_nook_test
          POSTGRES_PASSWORD: ci-only-local-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U open_nook_test -d open_nook_test_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://open_nook_test:ci-only-local-password@127.0.0.1:5432/open_nook_test_ci?schema=public
      TEST_DATABASE_URL: postgresql://open_nook_test:ci-only-local-password@127.0.0.1:5432/open_nook_test_ci?schema=public
      NEXT_TELEMETRY_DISABLED: 1
      CHECKPOINT_DISABLE: 1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run test:db
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Mocked browser journeys
        run: |
          NODE_OPTIONS="--import=$PWD/tests/fixtures/openrouter-mock.mjs --import=$PWD/tests/fixtures/mcp-mock.mjs" \
          OPENNOOK_TEST_MCP=1 MCP_CONTEXT7_URL=https://mcp.context7.com/mcp MCP_CONTEXT7_API_KEY=onk005-test-only-key \
          OPENNOOK_TEST_PROVIDER=1 OPENROUTER_API_KEY=onk004-test-only-key \
          OPENROUTER_MODEL_1=test/model-one \
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 33040 > /tmp/open-nook-test.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node --input-type=module -e 'for(let i=0;i<60;i++){try{const r=await fetch("http://127.0.0.1:33040/api/health");if(r.ok)process.exit(0)}catch{} await new Promise(r=>setTimeout(r,1000))} process.exit(1)'
          E2E_BASE_URL=http://127.0.0.1:33040 E2E_PERSISTENCE=1 E2E_MCP=1 npm run test:browser
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            test-results/
            /tmp/open-nook-test.log
          retention-days: 7
